name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/control-center-private-loopback]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile application
        run: python -m compileall app tests

      - name: Validate private tunnel boundary
        run: bash tests/test_control_center_private_tunnel.sh

      - name: Validate patch whitespace
        run: git diff --check origin/main...HEAD
